version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: bundler
    directories: ["/examples/oauth2", "/examples/events"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
